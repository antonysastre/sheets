version: 2
project_name: she

archives:
  - format: tar.gz
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README*
      - LICENSE

release:
  github:
    owner: antonysastre
    name: sheets
  extra_files:
    - glob: ./scripts/install.sh

builds:
  - id: she
    main: ./cmd/she
    binary: she
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
